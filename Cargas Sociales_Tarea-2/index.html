<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Impuestos y Cargas CR</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Impuestos y Cargas CR </h1>

  <section>
    <h2>Ejercicio 1: Cargas sociales e impuesto sobre la renta (Costa Rica)</h2>
    <label for="salarioBruto">Salario bruto mensual (₡):</label>
    <input type="number" id="salarioBruto" placeholder="Ejemplo: 1500000">
    <button id="btnCalcular">Calcular</button>
    <div id="resultadoSalario"></div>
  </section>

  <section>
    <h2>Ejercicio 2: Manipulación del DOM</h2>
    <p id="parrafo">Este es el texto original del párrafo.</p>
    <button id="btnCambiar">Cambiar texto</button>
  </section>

  <section>
    <h2>Ejercicio 3: Calculo de Edad</h2>
    <label for="edad">Ingrese su edad:</label>
    <input type="number" id="edad">
    <button id="btnEdad">Evaluar</button>
    <p id="mensajeEdad"></p>
  </section>

  <section>
    <h2>Ejercicio 4: Datos de Estudiantes</h2>
    <button id="btnEstudiantes">Mostrar estudiantes</button>
    <div id="listaEstudiantes"></div>
    <p id="promedio"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
